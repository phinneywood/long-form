<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Long Form developer replay</title><link rel="stylesheet" href="/styles.css"><style>
body{margin:0}.qa-tools{padding:16px;border-bottom:1px solid var(--rule);display:flex;gap:16px;align-items:center;flex-wrap:wrap;font:14px var(--sans)}.qa-tools label{display:flex;gap:8px;align-items:center}.qa-tools p{margin:0;width:100%}.qa-stage{padding:16px;overflow:auto;background:#e6e8e1}#qa-frame{display:block;margin:0 auto;border:1px solid var(--rule);width:390px;height:844px;background:var(--paper)}input[type=file]{max-width:260px}
</style></head><body><div class="qa-tools"><strong>Developer replay</strong><label>Snapshot <input id="qa-file" type="file" accept=".json,application/json"></label><label>Width <select id="qa-width"><option>390</option><option>320</option><option>1440</option></select></label><label>Scenario <select id="qa-scenario"><option value="normal">Captured account</option><option value="empty">No editions</option><option value="error">Edition API unavailable</option></select></label><button id="qa-reset" class="btn">Reset replay</button><details><summary>Paste snapshot instead</summary><label for="qa-json">Snapshot JSON</label><textarea id="qa-json" rows="3"></textarea><button class="btn" id="qa-load">Load snapshot</button></details><p id="qa-status" role="status">Choose a validation snapshot. Data stays in this browser. All account changes and sends are disabled.</p></div><div class="qa-stage"><iframe id="qa-frame" title="Long Form application replay" sandbox="allow-scripts allow-same-origin allow-popups"></iframe></div><script type="module" src="/developer.js"></script></body></html>
