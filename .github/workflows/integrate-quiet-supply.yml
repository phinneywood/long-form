name: Integrate and verify quiet-day supply
on:
  push:
    branches: ['fix/quiet-day-supply']
    paths: ['.github/workflows/integrate-quiet-supply.yml', 'scripts/apply_supply_patch.py']
permissions: {contents: write}
concurrency:
  group: quiet-supply-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'phinneywood/long-form'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Preserve the first-issue preview already deployed to production
        run: |
          git config user.name 'Long Form implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/frozen-first-issue
          test "$(git rev-parse FETCH_HEAD)" = '808fdb9288e53feb1e70d711bbb80102bf6aa1dd'
          git merge --no-commit --no-ff FETCH_HEAD
      - run: python scripts/apply_supply_patch.py
      - run: npm ci
      - run: deno check supabase/functions/worker/index.ts supabase/functions/app-api/index.ts supabase/functions/mcp/index.ts
      - run: deno test --allow-env --allow-read supabase/tests
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_nate_feed.py'
      - run: deno run --allow-env --allow-read --allow-write=/tmp/publication-verification scripts/render_quiet_fixture.ts
      - name: Verify anonymous scoped-feed publication without altering subscriptions
        run: |
          curl --fail --max-time 20 https://raw.githubusercontent.com/phinneywood/long-form/feed-data/nate-ai.xml -o /tmp/publication-verification/nate-ai.xml
          python -c "from xml.etree import ElementTree as E; r=E.parse('/tmp/publication-verification/nate-ai.xml'); assert r.findtext('channel/generator')=='Long Form scoped feed'; print('Public scoped feed:',len(r.findall('channel/item')),'verified items')"
      - name: Commit only verified integration changes
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/quiet-day-supply'
          git rm scripts/apply_supply_patch.py .github/workflows/integrate-quiet-supply.yml
          git add index.html supabase/functions
          git commit -m 'Integrate bounded quiet-day supply while preserving frozen first-issue preview'
          git push origin HEAD:fix/quiet-day-supply
          git rev-parse HEAD > /tmp/publication-verification/commit.txt
          tar --exclude=.git --exclude=node_modules -czf /tmp/publication-verification/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with: {name: integrated-quiet-supply, path: /tmp/publication-verification}
