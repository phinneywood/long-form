name: Verify cover typography
on:
  push:
    branches: ['fix/publication-identity']
    paths: ['.github/workflows/verify-cover-fonts.yml']
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DENO_DIR: /tmp/deno-cache
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: npm ci
      - run: python -m pip install fonttools==4.60.1
      - name: Embed verified, licensed cover glyphs without runtime font requests
        shell: python
        run: |
          import base64, hashlib, subprocess
          from pathlib import Path
          from urllib.request import urlopen
          from fontTools.ttLib import TTFont
          revision = 'ffebf8c1ee449e544955a7e813c54f9b73848eac'
          origin = f'https://raw.githubusercontent.com/notofonts/noto-fonts/{revision}'
          entries = []
          for family, weight, filename in [('PublicationSerif',400,'NotoSerif-Regular'),('PublicationSerif',700,'NotoSerif-Bold'),('PublicationSans',400,'NotoSans-Regular')]:
              folder = 'NotoSerif' if 'Serif' in filename else 'NotoSans'
              data = urlopen(f'{origin}/hinted/ttf/{folder}/{filename}.ttf', timeout=30).read()
              path = Path('/tmp') / (filename + '.ttf')
              path.write_bytes(data)
              output = path.with_suffix('.subset.ttf')
              subprocess.run(['pyftsubset',str(path),'--unicodes=U+0000-024F,U+0370-052F,U+2000-206F,U+20AC','--output-file='+str(output)],check=True)
              cmap = TTFont(output).getBestCmap()
              assert all(ord(c) in cmap for c in 'Kākāpō café — Long Form'), filename
              encoded = base64.b64encode(output.read_bytes()).decode()
              entries.append({'name':family,'weight':weight,'data':encoded})
              print(filename, 'source_sha256', hashlib.sha256(data).hexdigest(), 'subset_bytes',output.stat().st_size)
          module = '// Noto fonts, SIL Open Font License 1.1. See docs/cover-font-license.txt.\n// Pinned upstream: '+revision+'; Latin/Greek/Cyrillic/punctuation subset.\nimport { Buffer } from "node:buffer";\nexport const coverFonts = [\n'
          for entry in entries:
              module += '  { name: '+repr(entry['name'])+', weight: '+str(entry['weight'])+' as const, style: "normal" as const, data: Buffer.from('+repr(entry['data'])+', "base64") },\n'
          module += '];\n'
          Path('supabase/functions/_shared/cover-fonts.ts').write_text(module)
          Path('docs/cover-font-license.txt').write_bytes(urlopen(origin+'/LICENSE',timeout=30).read())
          p = Path('supabase/functions/_shared/epub.ts'); s = p.read_text()
          s = s.replace('import JSZip from', 'import { coverFonts } from "./cover-fonts.ts";\nimport JSZip from',1)
          s = s.replace('fontFamily: "serif"','fontFamily: "PublicationSerif"').replace('fontFamily: "sans-serif"','fontFamily: "PublicationSans"')
          assert s.count('new ImageResponse(cover, { width: 1200, height: 1920 })') == 1
          s = s.replace('new ImageResponse(cover, { width: 1200, height: 1920 })','new ImageResponse(cover, { width: 1200, height: 1920, fonts: coverFonts })')
          p.write_text(s)
      - run: deno check supabase/functions/worker/index.ts
      - run: deno test --allow-env --allow-read supabase/tests
      - run: node --test tests/*.test.mjs
      - run: deno run --allow-env --allow-read --allow-write=/tmp/publication-verification scripts/render_quiet_fixture.ts
      - name: Package validation artifacts and offline test dependencies
        run: |
          tar --exclude=.git --exclude=node_modules -czf /tmp/publication-verification/source.tar.gz .
          mkdir -p /tmp/toolchain
          cp "$(which deno)" /tmp/toolchain/deno
          tar -czf /tmp/publication-verification/offline-toolchain.tar.gz -C /tmp/toolchain deno -C /tmp deno-cache -C "$GITHUB_WORKSPACE" node_modules
      - uses: actions/upload-artifact@v4
        with: {name: verified-cover-and-test-runtime, path: /tmp/publication-verification}
      - name: Commit only verified cover changes
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/publication-identity'
          git config user.name 'Long Form implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-cover-fonts.yml
          git add supabase/functions/_shared/epub.ts supabase/functions/_shared/cover-fonts.ts docs/cover-font-license.txt
          git commit -m 'Render original accented cover titles with bundled publication fonts'
          git push origin HEAD:fix/publication-identity
