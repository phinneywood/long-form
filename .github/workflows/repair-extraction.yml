name: Repair extraction candidate
on:
  push:
    branches: [fix/packet-extraction-recovery]
    paths: [.github/workflows/repair-extraction.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Add verified publisher-challenge handling and worker regressions
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          article = Path('supabase/functions/_shared/article.ts')
          tests = Path('supabase/tests/packet_worker_test.ts')
          for path, expected in [(article, '1fd687258ad82ae9a959b20edc15c38ca0364b83'), (tests, '03ddc49acecf708e1e54a3214657ec31fca47d8a')]:
              assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == expected, f'Source changed: {path}'
          def once(text, old, new):
              assert text.count(old) == 1, f'Expected one occurrence: {old[:100]}'
              return text.replace(old, new, 1)
          text = article.read_text()
          old = 'export function extractArticleDocument(pageHtml: string, pageUrl: string) {\n  const document = (parseHTML(pageHtml) as any).document;'
          new = old + r'''
            // Some publishers return HTTP 200 for a browser/CAPTCHA interstitial.
            // Never package that page as an article or schedule futile retries.
            const pageTitle = String(document.title || "").trim();
            if (/^(?:Checking your browser(?:\s*[-–—]\s*reCAPTCHA)?|Just a moment[.!…]*|Attention Required!?\s*\|\s*Cloudflare)$/i.test(pageTitle)) {
              throw new ArticleContentError("The publisher requires browser verification; no article was retrieved. Choose another public source or supply the document.");
            }'''
          article.write_text(once(text, old, new))
          text = tests.read_text()
          text = once(text, '"mismatch" | "request")', '"mismatch" | "request" | "permanent_http" | "challenge_http" | "transient_http")')
          text = once(text, '      assert(i > 0 && i <= 5);', '''      assert(i > 0 && i <= 5);
                if (i === 4 && mode === "permanent_http") return new Response("Forbidden", { status: 403 });
                if (i === 4 && mode === "transient_http") return new Response("Unavailable", { status: 503, headers: { "retry-after": "3600" } });
                if (i === 4 && mode === "challenge_http") return new Response(`<html><head><title>Checking your browser - reCAPTCHA</title></head><body><article><p>${"Please verify that you are human before proceeding. ".repeat(100)}</p></article></body></html>`);''')
          text += '''
          Deno.test("permanent article HTTP failure stops on the first failure without email or partial outbox", async () => {
            const r = await packetScenario("permanent_http");
            assert(r.job.status === "failed" && r.job.attempts === 1);
            assert(r.sends === 0 && !r.outbox && r.checkpoints.length === 3);
            assert(r.fetches.filter(p => p === "/article-4").length === 1);
            assert(r.job.error.includes("Article 4") && r.job.error.includes("HTTP 403"));
          });

          Deno.test("HTTP 200 browser challenges are explicit terminal failures, never reading content", async () => {
            const r = await packetScenario("challenge_http");
            assert(r.job.status === "failed" && r.job.attempts === 1);
            assert(r.sends === 0 && !r.outbox && r.checkpoints.length === 3);
            assert(r.job.error.includes("browser verification"));
          });

          Deno.test("transient article HTTP failures retain the attempt cap and publisher backoff", async () => {
            const started = Date.now();
            const r = await packetScenario("transient_http");
            assert(r.job.status === "failed" && r.job.attempts === 3);
            assert(r.sends === 0 && !r.outbox && r.checkpoints.length === 3);
            assert(r.fetches.filter(p => p === "/article-4").length === 3);
            assert(Date.parse(r.job.run_after) >= started + 3_600_000);
          });
          '''
          tests.write_text(text)
          doc = Path('docs/kindle-packet-reliability.md')
          text = doc.read_text()
          assert '## Publisher failures and image URL recovery' not in text
          text += '''
          ## Publisher failures and image URL recovery

          A later original-packet attempt exposed two distinct publisher conditions: an HTTP 403 response and an HTTP 200 browser-verification page. Neither contains a usable original article. Previously the worker discarded the typed HTTP cause while adding article-position context, then treated every ordinary error as retryable (up to three attempts with ten-/twenty-minute delays).

          Article context now preserves its cause. Permanent HTTP/content failures stop immediately with an explicit error; transient HTTP failures retain the three-attempt cap and respect a longer publisher Retry-After. Browser-verification pages are recognized before Readability, never packaged, and never bypassed. Unknown delivery/receipt failures retain the existing frozen-payload reconciliation behavior. Claim and failure-state database writes are checked for errors.

          Encoded publisher image URLs previously swallowed the wrapper's outer width/quality parameters, producing paths such as image.png&w=3840&q=75 and HTTP 400 responses. Query parsing now separates wrapper options from the encoded publisher URL, preserving the publisher's own query string and existing absolute URLs. URL validation, image limits and unsupported-conversion warnings remain unchanged.

          When PMC actually returns article HTML, its explicitly labelled authored section is preserved, including references and tables. Scholarly citation metadata supplies the title, all listed authors and publication date. This is not a CAPTCHA workaround: another accessible original publisher URL is required when the host blocks the worker.

          Regression coverage includes wrapped permanent/transient HTTP errors, long HTTP-200 verification pages, actual worker terminal/retry states, zero submission on extraction failure, Retry-After, image URL queries, scholarly structure, and existing checkpoint/frozen-outbox/provider-receipt behavior. Deployment and live delivery observations are recorded in the release pull request; provider acceptance is not proof of Kindle arrival.
          '''
          doc.write_text(text)
          PY
      - run: npm ci
      - run: deno check supabase/functions/worker/index.ts supabase/functions/app-api/index.ts supabase/functions/mcp/index.ts
      - name: Run all publishing regressions
        run: deno test --allow-env --allow-read supabase/tests
      - name: Commit only verified source and tests
        run: |
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/article.ts supabase/tests/packet_worker_test.ts docs/kindle-packet-reliability.md
          git commit -m 'Recognize publisher verification pages and verify terminal worker failures'
          git push origin HEAD:refs/heads/fix/packet-extraction-recovery
