name: Apply and verify publication repair
on:
  push:
    branches: ['fix/publication-identity']
    paths: ['scripts/apply_publication_patch.py', '.github/workflows/publication-patch.yml']
permissions:
  contents: write
concurrency:
  group: publication-patch
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'phinneywood/long-form'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: npm ci
      - run: python scripts/apply_publication_patch.py
      - run: deno check supabase/functions/worker/index.ts
      - run: deno test --allow-env --allow-read supabase/tests
      - run: node --test tests/*.test.mjs
      - run: deno run --allow-env --allow-read --allow-write=/tmp/publication-verification scripts/render_quiet_fixture.ts
      - name: Package verified source and publication fixture
        run: |
          tar --exclude=.git --exclude=node_modules -czf /tmp/publication-verification/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: publication-verification
          path: /tmp/publication-verification
      - name: Commit verified source changes on this feature branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/publication-identity'
          git config user.name 'Long Form implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_publication_patch.py .github/workflows/publication-patch.yml
          git add supabase/functions/_shared/epub.ts supabase/functions/worker/core.ts
          git commit -m 'Separate publication identity from fallback labels and simplify tiny issues'
          git push origin HEAD:fix/publication-identity
