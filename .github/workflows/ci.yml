name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install pinned dependencies
        run: npm ci
      - name: Check app API
        run: deno check supabase/functions/app-api/index.ts
      - name: Check worker
        run: deno check supabase/functions/worker/index.ts
      - name: Check MCP
        run: deno check supabase/functions/mcp/index.ts
      - name: Check OAuth
        run: deno check supabase/functions/oauth/index.ts
      - name: Test publishing pipeline
        run: deno test --allow-env --allow-read supabase/tests
      - name: Test interface regressions
        run: node --test tests/*.test.mjs
      - name: Check browser script syntax
        run: |
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('index.html', 'utf8')
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1])
            .filter(Boolean)
          for (const script of scripts) new Function(script)
          console.log('Browser scripts parsed:', scripts.length)
          NODE

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify publication on mobile and desktop
        run: node tests/browser.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Preserve existing settings and onboarding journeys
        run: node tests/settings-browser.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          WIDTHS: 390
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: test-results/
